services:
  backend-test:
    build:
      context: .
    volumes:
      - .:/usr/src/app
      - ./node_modules:/usr/src/app/node_modules
    # command: sh -c "npm install &&  npm run migration:run && npm run seed && npm run start:dev"

    env_file:
      - .env
    ports:
      - ${PORT}:3000

    command: npm run test # Runs the tests instead of starting the app
  db:
    image: postgres:14.1-alpine
    environment:
      - POSTGRES_USER=waseet
      - POSTGRES_PASSWORD=darkNight
      - POSTGRES_DB=waseet
    ports:
      - '5434:5432' # Different port to avoid conflicts
    volumes:
      - test-db-data:/var/lib/postgresql/data # Ephemeral volume for tests
volumes:
  test-db-data:
