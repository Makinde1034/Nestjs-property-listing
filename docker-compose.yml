services:
  backend:
    build:
      context: .
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
    volumes:
      - .:/usr/src/app
      - ./node_modules:/usr/src/app/node_modules
    environment:
      NODE_ENV: development
    command: sh -c "npm run start:dev"
    env_file:
      - .env
    ports:
      - ${PORT}:3000 # <host port> : <container port>
    networks:
      - app-network
    depends_on:
      - postgres

  # PostGIS-enabled Postgres DB
  #
  postgres:
    image: postgis/postgis:14-3.3-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=waseet_db
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - db:/var/lib/postgresql/data
    command: -p ${POSTGRES_PORT}
    restart: always
    networks:
      - app-network

volumes:
  db:

networks:
  app-network:
    driver: bridge
