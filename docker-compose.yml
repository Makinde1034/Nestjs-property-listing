version: '3.3'

services:
  backend:
    build:
      context: .
    volumes:
      - .:/usr/src/app
      - ./node_modules:/usr/src/app/node_modules
    command: sh -c "npm install && npm run migration:run && npm run start:dev"
    env_file:
      - .env
    ports:
      - ${PORT}:3000 # <host port> : <container port>
    networks:
      - app-network
    depends_on:
      - postgres
      - puppeteer # New dependency on Puppeteer service

  puppeteer:
    image: zenika/alpine-chrome:latest
    shm_size: 1gb # Adjust as per your application's needs
    command: ['chromium-browser', '--no-sandbox', '--disable-setuid-sandbox']
    networks:
      - app-network
    depends_on:
      - postgres # Ensure Puppeteer waits for PostgreSQL to be ready

  postgres:
    image: postgres:14.1-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=waseet_db
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - db:/var/lib/postgresql/data
    command: -p ${POSTGRES_PORT}
    restart: always
    networks:
      - app-network

volumes:
  db:

networks:
  app-network:
    driver: bridge
